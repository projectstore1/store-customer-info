<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Debug - Abdullah Store</title>
</head>
<body style="font-family:monospace;padding:20px;background:#111;color:#0f0;min-height:100vh">
<h2>🔍 Firebase Debug</h2>
<pre id="log" style="white-space:pre-wrap;font-size:14px;line-height:1.7"></pre>

<script type="module">
const log = (m, c='#0f0') => {
  document.getElementById('log').innerHTML += `<span style="color:${c}">${m}</span>\n`;
};

log("URL: " + location.href);
log("──────────────────────");
log("▶ Step 1: Loading config...");

try {
  const cfg = await import('./js/firebase-config.js');
  log("✅ Config module loaded");
  log("   apiKey: " + cfg.firebaseConfig.apiKey);
  log("   databaseURL: " + cfg.firebaseConfig.databaseURL);
  log("   projectId: " + cfg.firebaseConfig.projectId);
  log("   isConfigured: " + cfg.isFirebaseConfigured());
} catch (e) {
  log("❌ Config load failed: " + e.message, '#f00');
  log(e.stack, '#f00');
}

log("");
log("▶ Step 2: Loading Firebase SDK from CDN...");

try {
  const appMod = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  log("✅ Firebase app SDK loaded");
} catch (e) {
  log("❌ Firebase SDK load failed: " + e.message, '#f00');
  log("    (this is likely a network/CORS issue)", '#f90');
}

log("");
log("▶ Step 3: Initializing Firebase...");

try {
  const svc = await import('./js/firebase-service.js');
  log("✅ Service module loaded");
  
  await svc.initFirebase();
  log("✅ Firebase initialized!");
} catch (e) {
  log("❌ Init failed: " + e.message, '#f00');
  log(e.stack, '#f00');
}

log("");
log("▶ Step 4: Reading data from database...");

try {
  const svc = await import('./js/firebase-service.js');
  const data = await svc.loadAllData();
  log("✅ Data loaded!");
  log("   Customers: " + data.customers.length);
  log("   Transactions: " + data.transactions.length);
  log("");
  log("🎉 ALL OK — main site will work!", '#0f0');
} catch (e) {
  log("❌ Data load failed: " + e.message, '#f00');
  log(e.stack, '#f00');
  log("");
  log("👉 This is likely a Firebase Rules issue.", '#f90');
  log("   Firebase Console → Realtime Database → Rules", '#f90');
  log("   Make sure rules are published.", '#f90');
}
</script>
</body>
</html>
