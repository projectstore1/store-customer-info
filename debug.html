<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Debug - Abdullah Store</title>
</head>
<body style="font-family:monospace;padding:20px;background:#111;color:#0f0;min-height:100vh">
<h2>🔍 Full Debug</h2>
<pre id="log" style="white-space:pre-wrap;font-size:14px;line-height:1.7"></pre>

<script type="module">
const log = (m, c='#0f0') => {
  document.getElementById('log').innerHTML += `<span style="color:${c}">${m}</span>\n`;
};

log("Testing all files...");
log("──────────────────────");

// Test 1: All JS files accessible
const filesToTest = [
  './js/firebase-config.js',
  './js/firebase-service.js',
  './js/ui.js',
  './js/calculator.js',
  './js/app.js',
  './css/style.css'
];

for (const f of filesToTest) {
  try {
    const r = await fetch(f, { method: 'HEAD' });
    if (r.ok) log(`✅ ${f}`);
    else log(`❌ ${f} → HTTP ${r.status}`, '#f00');
  } catch (e) {
    log(`❌ ${f} → ${e.message}`, '#f00');
  }
}

log("");
log("──────────────────────");
log("▶ Testing config import...");

let cfg;
try {
  cfg = await import('./js/firebase-config.js');
  log("✅ firebase-config.js imported");
  log("   databaseURL: " + cfg.firebaseConfig.databaseURL);
  log("   isConfigured: " + cfg.isFirebaseConfigured());
} catch (e) {
  log("❌ " + e.message, '#f00');
  log(e.stack, '#f00');
}

log("");
log("▶ Testing Firebase init...");

try {
  const svc = await import('./js/firebase-service.js');
  log("✅ firebase-service.js imported");

  await svc.initFirebase();
  log("✅ Firebase initialized!");

  log("");
  log("▶ Loading data...");
  const data = await svc.loadAllData();
  log("✅ Data loaded!");
  log("   Customers: " + data.customers.length);
  log("   Transactions: " + data.transactions.length);
  log("");
  log("🎉 ALL GOOD — main site should work!", '#0f0');
} catch (e) {
  log("❌ " + e.message, '#f00');
  log(e.stack, '#f00');
}

log("");
log("▶ Testing ui.js import...");
try {
  const ui = await import('./js/ui.js');
  log("✅ ui.js imported");
  log("   exports: " + Object.keys(ui).join(', '));
} catch (e) {
  log("❌ " + e.message, '#f00');
}

log("");
log("▶ Testing calculator.js import...");
try {
  const calc = await import('./js/calculator.js');
  log("✅ calculator.js imported");
  log("   exports: " + Object.keys(calc).join(', '));
} catch (e) {
  log("❌ " + e.message, '#f00');
}
</script>
</body>
</html>
